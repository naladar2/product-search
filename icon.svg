<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="round"><rect width="192" height="192" rx="42" ry="42"/></clipPath>
  </defs>
  <rect width="192" height="192" rx="42" ry="42" fill="#15171c"/>
  <g clip-path="url(#round)">
    <!-- Коробка -->
    <rect x="19" y="77" width="103" height="88" rx="10" ry="10" fill="#1d2026" stroke="#f2b134" stroke-width="9"/>
    <!-- Крышка -->
    <line x1="24" y1="102" x2="116" y2="102" stroke="#f2b134" stroke-width="9" stroke-linecap="round"/>
    <!-- Ушко крышки -->
    <rect x="56" y="64" width="28" height="18" rx="5" ry="5" fill="#f2b134"/>
    <!-- Полоски внутри -->
    <rect x="28" y="114" width="62" height="9" rx="4" fill="#f2b134" opacity="0.7"/>
    <rect x="28" y="130" width="42" height="9" rx="4" fill="#f2b134" opacity="0.6"/>
    <rect x="28" y="146" width="52" height="9" rx="4" fill="#f2b134" opacity="0.65"/>
    <!-- Лупа - круг -->
    <circle cx="135" cy="55" r="34" fill="#1d2026" stroke="#f8fafc" stroke-width="11"/>
    <circle cx="135" cy="55" r="19" fill="#4a3a19"/>
    <!-- Блик -->
    <circle cx="126" cy="46" r="6" fill="#ffd98a" opacity="0.85"/>
    <!-- Ручка лупы -->
    <line x1="158" y1="78" x2="178" y2="100" stroke="#f8fafc" stroke-width="11" stroke-linecap="round"/>
  </g>
</svg>
