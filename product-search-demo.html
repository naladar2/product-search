<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поиск товара по фото</title>
<style>
  :root{
    --bg:#15171c;
    --panel:#1d2026;
    --line:#2b2f38;
    --text:#e8eaee;
    --dim:#8b93a1;
    --accent:#f2b134;
    --accent-dim:#7a5c1c;
    --good:#4fd68a;
    --error:#e74c3c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:20px 16px 14px; border-bottom:1px solid var(--line);
  }
  header h1{
    margin:0 0 4px; font-size:19px; font-weight:700; letter-spacing:-0.01em;
  }
  header p{margin:0; color:var(--dim); font-size:13px;}

  main{max-width:520px; margin:0 auto; padding:16px;}

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px; margin-bottom:14px;
  }
  .panel h2{font-size:13px; margin:0 0 10px; color:var(--dim); font-weight:600;}

  input[type=text]{
    width:100%; padding:10px 11px; background:#12141a; border:1px solid var(--line);
    border-radius:7px; color:var(--text); font-size:14px;
  }
  button{
    appearance:none; border:none; border-radius:7px; padding:11px 16px;
    font-size:14px; font-weight:600; cursor:pointer;
  }
  .btn-primary{background:var(--accent); color:#1a1200; width:100%; margin-top:10px;}
  .btn-primary:disabled{background:var(--accent-dim); color:#a8935b; cursor:default;}
  .btn-secondary{background:transparent; color:var(--dim); border:1px solid var(--line); width:100%; margin-top:8px;}

  .status{font-size:12.5px; color:var(--dim); margin-top:8px; min-height:16px;}
  .status.error{color:var(--error);}
  .bar{height:4px; background:var(--line); border-radius:2px; margin-top:8px; overflow:hidden; display:none;}
  .bar.active{display:block;}
  .bar > div{height:100%; background:var(--accent); width:0%; transition:width .2s;}

  #photoInput{display:none;}
  .capture-label{
    display:block; text-align:center; background:var(--accent); color:#1a1200;
    padding:14px; border-radius:9px; font-weight:700; font-size:15px; cursor:pointer;
  }
  .capture-label.disabled{background:var(--accent-dim); color:#a8935b; pointer-events:none;}

  .results{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
  .result{
    display:flex; align-items:center; gap:10px; background:#12141a;
    border:1px solid var(--line); border-radius:8px; padding:8px;
  }
  .result img{width:52px; height:52px; object-fit:cover; border-radius:6px; background:#000; flex-shrink:0;}
  .result .code{font-weight:700; font-size:14px;}
  .result .score{font-size:12px; color:var(--good); margin-top:2px;}
  .result:first-child{border-color:var(--accent);}

  .hint{font-size:11.5px; color:var(--dim); line-height:1.5; margin-top:10px;}
  
  .test-section {
    margin-top: 12px;
    padding: 10px;
    background: #1a1d24;
    border-radius: 6px;
    border: 1px solid var(--line);
  }
  .test-section summary {
    cursor: pointer;
    color: var(--dim);
    font-size: 12px;
  }
  .test-section pre {
    font-size: 11px;
    color: var(--dim);
    overflow: auto;
    max-height: 200px;
    white-space: pre-wrap;
    word-wrap: break-word;
    margin: 8px 0 0;
  }
</style>
</head>
<body>

<header>
  <h1>Поиск товара по фото</h1>
  <p>Индекс строится один раз из таблицы, дальше — офлайн</p>
</header>

<main>

  <div class="panel">
    <h2>1. ИСТОЧНИК ДАННЫХ</h2>
    <input type="text" id="sheetUrl" placeholder="Ссылка на лист (публикация в формате CSV)">
    <button class="btn-primary" id="buildBtn">Построить / обновить индекс</button>
    <div class="bar" id="bar"><div id="barFill"></div></div>
    <div class="status" id="buildStatus"></div>
    <div class="hint">
      Файл → Опубликовать в интернете → выбрать лист → CSV. Колонки: D — код товара, J и K — ссылки на фото.
    </div>
    
    <details class="test-section">
      <summary>Показать отладочную информацию</summary>
      <pre id="debugInfo">Ожидание...</pre>
    </details>
  </div>

  <div class="panel">
    <h2>2. СФОТОГРАФИРОВАТЬ ТОВАР</h2>
    <input type="file" id="photoInput" accept="image/*" capture="environment">
    <label for="photoInput" class="capture-label disabled" id="captureLabel">Сначала постройте индекс</label>
    <div class="status" id="searchStatus"></div>
    <div class="results" id="results"></div>
  </div>

</main>

<script type="module">
  import { buildIndex, findSimilar, getIndexSize, clearIndex } from './product-search.js';

  const sheetUrlInput = document.getElementById('sheetUrl');
  const buildBtn = document.getElementById('buildBtn');
  const buildStatus = document.getElementById('buildStatus');
  const bar = document.getElementById('bar');
  const barFill = document.getElementById('barFill');
  const photoInput = document.getElementById('photoInput');
  const captureLabel = document.getElementById('captureLabel');
  const searchStatus = document.getElementById('searchStatus');
  const results = document.getElementById('results');
  const debugInfo = document.getElementById('debugInfo');

  // Колонки в таблице: D=3, J=9, K=10 (считая от A=0)
  const COL_CODE = 3, COL_IMG1 = 9, COL_IMG2 = 10;

  /**
   * Надёжный парсер CSV с поддержкой кавычек
   */
  function parseCsv(text) {
    const rows = [];
    let currentRow = [];
    let currentField = '';
    let insideQuotes = false;
    let i = 0;
    
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    
    while (i < text.length) {
      const char = text[i];
      const nextChar = text[i + 1];
      
      if (insideQuotes) {
        if (char === '"') {
          if (nextChar === '"') {
            currentField += '"';
            i += 2;
          } else {
            insideQuotes = false;
            i++;
          }
        } else {
          currentField += char;
          i++;
        }
      } else {
        if (char === '"') {
          insideQuotes = true;
          i++;
        } else if (char === ',') {
          currentRow.push(currentField.trim());
          currentField = '';
          i++;
        } else if (char === '\n' || char === '\r') {
          if (char === '\r' && nextChar === '\n') {
            i += 2;
          } else {
            i++;
          }
          currentRow.push(currentField.trim());
          currentField = '';
          if (currentRow.some(f => f !== '')) {
            rows.push(currentRow);
          }
          currentRow = [];
        } else {
          currentField += char;
          i++;
        }
      }
    }
    
    if (currentField !== '' || currentRow.length > 0) {
      currentRow.push(currentField.trim());
      if (currentRow.some(f => f !== '')) {
        rows.push(currentRow);
      }
    }
    
    return rows;
  }

  async function loadProductsFromSheet(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error('Не удалось загрузить таблицу (' + res.status + ')');
    const text = await res.text();
    const rows = parseCsv(text);
    
    if (rows.length < 2) {
      throw new Error('В таблице недостаточно данных. Нужна хотя бы 1 строка с данными после заголовков.');
    }
    
    // Отладка
    debugInfo.textContent = `Загружено строк: ${rows.length}\nПервые 3 строки:\n${JSON.stringify(rows.slice(0, 3), null, 2)}`;
    
    const products = rows.slice(1)
      .map((r, idx) => {
        const code = r[COL_CODE] || '';
        const img1 = r[COL_IMG1] || '';
        const img2 = r[COL_IMG2] || '';
        const images = [img1, img2].filter(Boolean);
        return { code, images };
      })
      .filter(p => p.code && p.images.length);
    
    if (products.length === 0) {
      throw new Error('Не найдено товаров с кодом (колонка D) и ссылками на фото (колонки J или K)');
    }
    
    debugInfo.textContent += `\n\nНайдено товаров с фото: ${products.length}\nПример: ${JSON.stringify(products.slice(0, 3), null, 2)}`;
    
    return products;
  }

  async function refreshIndexedCount() {
    try {
      const n = await getIndexSize();
      if (n > 0) {
        captureLabel.classList.remove('disabled');
        captureLabel.textContent = 'Сфотографировать';
        buildStatus.textContent = `В индексе: ${n} фото`;
      } else {
        captureLabel.classList.add('disabled');
        captureLabel.textContent = 'Сначала постройте индекс';
      }
    } catch (e) {
      console.warn('Ошибка при получении размера индекса:', e);
    }
  }
  
  refreshIndexedCount();

  buildBtn.addEventListener('click', async () => {
    const url = sheetUrlInput.value.trim();
    if (!url) { 
      buildStatus.textContent = 'Вставьте ссылку на CSV-публикацию листа'; 
      return; 
    }

    buildBtn.disabled = true;
    bar.classList.add('active');
    barFill.style.width = '0%';
    buildStatus.textContent = 'Загружаю модель CLIP (первый раз — до ~90 МБ)...';

    try {
      const products = await loadProductsFromSheet(url);
      buildStatus.textContent = `Найдено строк: ${products.length}. Индексирую фото...`;

      const { total, indexed } = await buildIndex(products, {
        onProgress: (done, totalJobs) => {
          barFill.style.width = Math.round((done / totalJobs) * 100) + '%';
          buildStatus.textContent = `Индексирую: ${done}/${totalJobs}`;
        },
      });

      buildStatus.textContent = `Готово. Новых фото: ${indexed} из ${total} проверенных.`;
      await refreshIndexedCount();
    } catch (err) {
      buildStatus.innerHTML = `<span class="error">Ошибка: ${err.message}</span>`;
      console.error('Ошибка:', err);
      debugInfo.textContent += `\n\nОшибка: ${err.message}\n${err.stack || ''}`;
    } finally {
      buildBtn.disabled = false;
      bar.classList.remove('active');
    }
  });

  photoInput.addEventListener('change', async () => {
    const file = photoInput.files[0];
    if (!file) return;

    results.innerHTML = '';
    searchStatus.textContent = 'Ищу похожий товар...';

    try {
      const matches = await findSimilar(file, 5);
      searchStatus.textContent = matches.length ? '' : 'Совпадений не найдено';

      results.innerHTML = matches.map(m => `
        <div class="result">
          <img src="${m.imageUrl}" loading="lazy" onerror="this.style.display='none'">
          <div>
            <div class="code">${m.code}</div>
            <div class="score">совпадение: ${(m.score * 100).toFixed(1)}%</div>
          </div>
        </div>
      `).join('');
    } catch (err) {
      searchStatus.textContent = 'Ошибка: ' + err.message;
      console.error(err);
    }
  });

  // Для отладки CORS-ошибок при загрузке картинок
  console.log('Если вы видите ошибки CORS с Kaspersky-лабс, это расширение антивируса, которое блокирует запросы.');
  console.log('Попробуйте отключить расширение Касперского или переключить браузер в режим инкогнито.');
</script>

</body>
</html>
